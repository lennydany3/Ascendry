      - generic [ref=e90]:
        - article [ref=e91]:
          - region "Who we are" [ref=e92]:
            - generic [ref=e93]:
              - generic [ref=e94]: "01"
              - heading "Who we are" [level=2] [ref=e95]
            - generic [ref=e96]:
              - paragraph [ref=e97]: "Ascendry is an MSME (Udyam) registered business based in Chennai, Tamil Nadu, India. We run two divisions:"
              - list [ref=e98]:
                - listitem [ref=e99]:
                  - generic [ref=e101]:
                    - strong [ref=e102]: Ascendry Studio
                    - text: "builds client work: websites, booking engines, payment flows, WhatsApp automation, admin dashboards, customer portals, inventory systems, loyalty programs, custom APIs, AI workflows and analytics."
                - listitem [ref=e103]:
                  - generic [ref=e105]:
                    - strong [ref=e106]: Ascendry Labs
                    - text: builds and launches Ascendry's own software products in-house.
              - paragraph [ref=e107]: This policy explains how we handle personal information across our website, our client work and our products. If you have a question, write to us at lennydany3@gmail.com or call +91 90435 56745.
          - region "Information we collect" [ref=e108]:
            - generic [ref=e109]:
              - generic [ref=e110]: "02"
              - heading "Information we collect" [level=2] [ref=e111]
            - generic [ref=e112]:
              - heading "Information you give us" [level=3] [ref=e113]
              - list [ref=e114]:
                - listitem [ref=e115]:
                  - generic [ref=e117]: Your name, email address and phone number.
                - listitem [ref=e118]:
                  - generic [ref=e120]: Business details and project briefs you share with us.
                - listitem [ref=e121]:
                  - generic [ref=e123]: Files, logos, images and other material you send.
              - heading "Information collected automatically" [level=3] [ref=e124]
              - list [ref=e125]:
                - listitem [ref=e126]:
                  - generic [ref=e128]: Your IP address, device and browser type.
                - listitem [ref=e129]:
                  - generic [ref=e131]: The pages you visit and how you move around the site.
                - listitem [ref=e132]:
                  - generic [ref=e134]: Cookies and similar technologies (see section 6).
              - heading "Payment information" [level=3] [ref=e135]
              - paragraph [ref=e136]:
                - text: Payments are processed by Razorpay (cards, UPI, net banking and wallets). We receive a transaction ID and payment status.
                - strong [ref=e137]: We do not see or store your card details.
              - heading "Ascendry Labs products" [level=3] [ref=e138]
              - paragraph [ref=e139]: If you use a Labs product, we collect account data and usage data needed to run it. Each product may have its own additional privacy notice, which applies alongside this policy.
          - region "How we use your information" [ref=e140]:
            - generic [ref=e141]:
              - generic [ref=e142]: "03"
              - heading "How we use your information" [level=2] [ref=e143]
            - generic [ref=e144]:
              - list [ref=e145]:
                - listitem [ref=e146]:
                  - generic [ref=e148]: Replying to your enquiries and preparing quotes.
                - listitem [ref=e149]:
                  - generic [ref=e151]: Delivering projects and providing support.
                - listitem [ref=e152]:
                  - generic [ref=e154]: Invoicing and keeping accounts.
                - listitem [ref=e155]:
                  - generic [ref=e157]: Improving our website and products.
                - listitem [ref=e158]:
                  - generic [ref=e160]: Meeting our legal and tax obligations.
              - paragraph [ref=e161]:
                - strong [ref=e162]: We do not sell your personal data.
          - region "Client projects" [ref=e163]:
            - generic [ref=e164]:
              - generic [ref=e165]: "04"
              - heading "Client projects" [level=2] [ref=e166]
            - paragraph [ref=e168]: When we build a system for a client, the data of that client's own customers belongs to the client. We process it only to build and maintain the system, and only on the client's instructions. If you are a customer of one of our clients, please contact that business first about your data.
          - region "Sharing your information" [ref=e169]:
            - generic [ref=e170]:
              - generic [ref=e171]: "05"
              - heading "Sharing your information" [level=2] [ref=e172]
            - generic [ref=e173]:
              - paragraph [ref=e174]: "We share information only with service providers we need to run our business, and only as far as necessary:"
              - list [ref=e175]:
                - listitem [ref=e176]:
                  - generic [ref=e178]: Hosting and cloud storage providers.
                - listitem [ref=e179]:
                  - generic [ref=e181]: Email and communication tools.
                - listitem [ref=e182]:
                  - generic [ref=e184]: Analytics providers.
                - listitem [ref=e185]:
                  - generic [ref=e187]: Our payment gateway, Razorpay.
              - paragraph [ref=e188]: We may also share information when the law requires it, for example in response to a lawful request from a court or authority.
          - region "Cookies and analytics" [ref=e189]:
            - generic [ref=e190]:
              - generic [ref=e191]: "06"
              - heading "Cookies and analytics" [level=2] [ref=e192]
            - generic [ref=e193]:
              - paragraph [ref=e194]: "Cookies are small files stored on your device. We use:"
              - list [ref=e195]:
                - listitem [ref=e196]:
                  - generic [ref=e198]:
                    - strong [ref=e199]: Essential cookies
                    - text: ", which keep the site working and remember your cookie choice."
                - listitem [ref=e200]:
                  - generic [ref=e202]:
                    - strong [ref=e203]: Analytics cookies
                    - text: ", only if you accept them, to understand which pages are useful."
              - paragraph [ref=e204]: You can accept or reject non-essential cookies in the banner shown on your first visit, and change your choice at any time using “Cookie settings” in the footer. You can also block or delete cookies in your browser settings. Some parts of the site may not work properly if you block essential cookies.
          - region "Data storage and security" [ref=e205]:
            - generic [ref=e206]:
              - generic [ref=e207]: "07"
              - heading "Data storage and security" [level=2] [ref=e208]
            - generic [ref=e209]:
              - paragraph [ref=e210]: We follow reasonable security practices to protect your information from loss, misuse and unauthorised access. No system is completely secure, but we take care to limit access and use trusted providers.
              - paragraph [ref=e211]: Some of our providers are reputable companies that may store data on servers outside India. By using our services you understand your information may be processed in those locations.
          - region "How long we keep information" [ref=e212]:
            - generic [ref=e213]:
              - generic [ref=e214]: "08"
              - heading "How long we keep information" [level=2] [ref=e215]
            - paragraph [ref=e217]: We keep personal information only for as long as we need it for the purpose it was collected. Invoices and accounting records are kept for the period required by Indian tax law. When information is no longer needed, we delete or anonymise it.
          - region "Your rights" [ref=e218]:
            - generic [ref=e219]:
              - generic [ref=e220]: "09"
              - heading "Your rights" [level=2] [ref=e221]
            - generic [ref=e222]:
              - paragraph [ref=e223]: "You can ask us to:"
              - list [ref=e224]:
                - listitem [ref=e225]:
                  - generic [ref=e227]: Show you the personal information we hold about you.
                - listitem [ref=e228]:
                  - generic [ref=e230]: Correct information that is wrong or incomplete.
                - listitem [ref=e231]:
                  - generic [ref=e233]: Delete your information, where we are not required to keep it.
                - listitem [ref=e234]:
                  - generic [ref=e236]: Withdraw consent you have given us.
                - listitem [ref=e237]:
                  - generic [ref=e239]: Nominate another person to exercise these rights for you.
              - paragraph [ref=e240]: To make a request, email lennydany3@gmail.com from the address linked to your information. We will respond within a reasonable time, and aim to do so within 30 days.
          - region "Children" [ref=e241]:
            - generic [ref=e242]:
              - generic [ref=e243]: "10"
              - heading "Children" [level=2] [ref=e244]
            - paragraph [ref=e246]: Our services are not directed at anyone under 18. We do not knowingly collect personal data from children. If you believe a child has given us information, please contact us and we will delete it.
          - region "Grievance Officer" [ref=e247]:
            - generic [ref=e248]:
              - generic [ref=e249]: "11"
              - heading "Grievance Officer" [level=2] [ref=e250]
            - generic [ref=e251]:
              - paragraph [ref=e252]: "If you have a concern or complaint about how we handle your information, please contact our Grievance Officer:"
              - list [ref=e253]:
                - listitem [ref=e254]:
                  - generic [ref=e256]:
                    - strong [ref=e257]: "Name:"
                    - text: Lenny Dany Derek D
                - listitem [ref=e258]:
                  - generic [ref=e260]:
                    - strong [ref=e261]: "Email:"
                    - text: lennydany3@gmail.com
                - listitem [ref=e262]:
                  - generic [ref=e264]:
                    - strong [ref=e265]: "Phone:"
                    - text: +91 90435 56745
              - paragraph [ref=e266]: We acknowledge complaints within 48 hours and aim to resolve them within 30 days.
          - region "Changes to this policy" [ref=e267]:
            - generic [ref=e268]:
              - generic [ref=e269]: "12"
              - heading "Changes to this policy" [level=2] [ref=e270]
            - generic [ref=e271]:
              - paragraph [ref=e272]: We may update this policy from time to time. The “Last updated” date at the top shows when it last changed. If we make a significant change, we will make that clear on the website.
              - paragraph [ref=e273]: This policy is written in line with the Information Technology Act, 2000 and its rules, and the Digital Personal Data Protection Act, 2023.
