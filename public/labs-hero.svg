<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="al3d-title">
  <title id="al3d-title">Ascendry Labs — from idea to launch</title>
  <style>
    text { font-family: JetBrains Mono, IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: uppercase; }
    .al3d-meta { font-size: 10px; letter-spacing: 0.18em; }
    .al3d-num { font-size: 10px; fill: rgba(255,255,255,0.45); letter-spacing: 0.1em; }
    .al3d-name { font-size: 11px; font-weight: 600; fill: #fff; letter-spacing: 0.14em; }
    .al3d-sub { font-size: 8.5px; fill: rgba(255,255,255,0.35); letter-spacing: 0.12em; }
    .al3d-piece { transform-box: fill-box; }
    .al3d-draw { stroke-dasharray: 1; stroke-dashoffset: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .al3d-in { animation: al3d-in 1.2s cubic-bezier(.2,.8,.2,1) backwards; }
      .al3d-in-r { animation-delay: 0s; }
      .al3d-in-l { animation-delay: .2s; }
      .al3d-in-c { animation-delay: .4s; }
      .al3d-float { animation: al3d-float 5s ease-in-out infinite; }
      .al3d-f-r { animation-delay: 0s; }
      .al3d-f-l { animation-delay: -1.6s; }
      .al3d-f-c { animation-delay: -3.2s; }
      .al3d-shadow { transform-box: fill-box; transform-origin: center; animation: al3d-shadow 5s ease-in-out infinite; }
      .al3d-s-r { animation-delay: 0s; }
      .al3d-s-l { animation-delay: -1.6s; }
      .al3d-s-c { animation-delay: -3.2s; }
      .al3d-draw { animation: al3d-draw 1.3s ease .5s backwards; }
      .al3d-late { animation: al3d-fade .8s ease 1.1s backwards; }
      .al3d-fade { animation: al3d-fade .6s ease 1.4s backwards; }
      .al3d-sheen { animation: al3d-sheen 6s ease-in-out 1.6s infinite; }
      .al3d-pulse { animation: al3d-pulse 2.4s ease-in-out infinite; }
    }
    @keyframes al3d-in { from { opacity: 0; transform: translate(var(--ix), var(--iy)); } to { opacity: 1; transform: none; } }
    @keyframes al3d-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes al3d-shadow { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.88); opacity: .75; } }
    @keyframes al3d-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes al3d-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes al3d-sheen { 0% { transform: translateX(-130px); } 55%, 100% { transform: translateX(170px); } }
    @keyframes al3d-pulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="al3d-chrome-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c2e"/><stop offset=".4" stop-color="#a1a1a6"/><stop offset=".65" stop-color="#3a3a3c"/><stop offset="1" stop-color="#8e8e93"/>
    </linearGradient>
    <linearGradient id="al3d-chrome-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d1d1d6"/><stop offset="1" stop-color="#8e8e93"/>
    </linearGradient>
    <linearGradient id="al3d-chrome-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48484a"/><stop offset="1" stop-color="#1c1c1e"/>
    </linearGradient>
    <linearGradient id="al3d-sheen-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="al3d-spot"><stop offset="0" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="al3d-grid-fade"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="al3d-reflect-grad" gradientUnits="userSpaceOnUse" x1="0" y1="560" x2="0" y2="650">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="al3d-reflect-mask" maskUnits="userSpaceOnUse" x="0" y="560" width="600" height="100"><rect x="0" y="560" width="600" height="100" fill="url(#al3d-reflect-grad)"/></mask>
    <mask id="al3d-grid-mask"><rect width="560" height="640" fill="url(#al3d-grid-fade)" transform="translate(0 0)"/></mask>
    <radialGradient id="al3d-shadow-grad"><stop offset="0" stop-color="#000" stop-opacity=".6"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <filter id="al3d-glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="al3d-shadow-blur" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
    <pattern id="al3d-grid-pat" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/></pattern>
    <clipPath id="al3d-clip-front"><polygon points="255,120 305,120 445,520 390,520"/></clipPath>
    <clipPath id="al3d-card"><rect x="1" y="1" width="558" height="638" rx="20"/></clipPath>
    <marker id="al3d-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7Z" fill="rgba(255,255,255,0.3)"/></marker>
    <g id="al3d-right-art">
<polygon points="273,106 323,106 463,506 408,506" fill="#1c1c1e"/>
<polygon points="255,120 305,120 323,106 273,106" fill="url(#al3d-chrome-top)" stroke="rgba(255,255,255,0.5)" stroke-width="0.75" stroke-linejoin="round"/>
<polygon points="305,120 445,520 463,506 323,106" fill="url(#al3d-chrome-side)" stroke="rgba(255,255,255,0.5)" stroke-width="0.75" stroke-linejoin="round"/>
<polygon points="255,120 305,120 445,520 390,520" fill="url(#al3d-chrome-front)" stroke="rgba(255,255,255,0.5)" stroke-width="0.75" stroke-linejoin="round"/>
<polyline points="390,520 255,120 305,120" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect x="1" y="1" width="558" height="638" rx="20" fill="#0d0d0f" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <g clip-path="url(#al3d-card)">
    <g id="al3d-grid" mask="url(#al3d-grid-mask)"><rect width="560" height="640" fill="url(#al3d-grid-pat)"/></g>
    <ellipse cx="290" cy="140" rx="160" ry="210" fill="url(#al3d-spot)"/>
  </g>

  <text class="al3d-meta" x="28" y="38" fill="rgba(255,255,255,0.4)">Fig. 02</text>
  <text class="al3d-meta" x="532" y="38" text-anchor="end" fill="rgba(255,255,255,0.4)">Exploded view</text>
  <text class="al3d-meta" x="28" y="612" fill="rgba(255,255,255,0.25)">Ascendry Labs / Assembly v0.1</text>
  <text class="al3d-meta" x="532" y="612" text-anchor="end" fill="rgba(255,255,255,0.25)">3 parts · 1 summit</text>

  <g id="al3d-a" transform="translate(300,300) scale(0.82) translate(-285,-320)">
    <g id="al3d-floor">
      <line x1="40" y1="560" x2="530" y2="560" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <g filter="url(#al3d-shadow-blur)">
        <ellipse class="al3d-shadow al3d-s-r" cx="426" cy="560" rx="62" ry="8" fill="url(#al3d-shadow-grad)"/>
        <ellipse class="al3d-shadow al3d-s-l" cx="124" cy="560" rx="46" ry="7" fill="url(#al3d-shadow-grad)"/>
        <ellipse class="al3d-shadow al3d-s-c" cx="196" cy="560" rx="52" ry="6" fill="url(#al3d-shadow-grad)" opacity=".7"/>
      </g>
      <g mask="url(#al3d-reflect-mask)" opacity=".12" class="al3d-late"><g transform="translate(0 1120) scale(1 -1)"><use href="#al3d-right-art"/></g></g>
    </g>

    <g id="al3d-guides" class="al3d-fade" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="0.75" stroke-dasharray="2 5">
      <line x1="147" y1="446" x2="201.08" y2="403.11" marker-end="url(#al3d-arrow)"/><line x1="138" y1="478" x2="192.08" y2="435.11" marker-end="url(#al3d-arrow)"/><line x1="181" y1="218" x2="210.58" y2="202.34" marker-end="url(#al3d-arrow)"/><line x1="91" y1="538" x2="120.58" y2="522.34" marker-end="url(#al3d-arrow)"/>
    </g>

    <g id="al3d-crossbar" class="al3d-piece al3d-in al3d-in-c" style="--ix:-18.9px;--iy:15px">
      <g class="al3d-piece al3d-float al3d-f-c"><g transform="translate(-58 46)">
<path d="M318 418L214 418M214 418L223 386M196 432L214 418" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.75" stroke-dasharray="3 4" class="al3d-late"/>
<path d="M205 400L290 400" pathLength="1" class="al3d-draw" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1" stroke-linecap="round"/>
<path d="M223 386L308 386" pathLength="1" class="al3d-draw" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1" stroke-linecap="round"/>
<path d="M205 400L223 386" pathLength="1" class="al3d-draw" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1" stroke-linecap="round"/>
<path d="M290 400L300 432" pathLength="1" class="al3d-draw" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1" stroke-linecap="round"/>
<path d="M308 386L318 418" pathLength="1" class="al3d-draw" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1" stroke-linecap="round"/>
<path d="M290 400L308 386" pathLength="1" class="al3d-draw" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1" stroke-linecap="round"/>
<path d="M300 432L196 432" pathLength="1" class="al3d-draw" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1" stroke-linecap="round"/>
<path d="M300 432L318 418" pathLength="1" class="al3d-draw" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1" stroke-linecap="round"/>
<path d="M196 432L205 400" pathLength="1" class="al3d-draw" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1" stroke-linecap="round"/>
<path d="M202 400H208M205 397V403M287 400H293M290 397V403M297 432H303M300 429V435M193 432H199M196 429V435M220 386H226M223 383V389M305 386H311M308 383V389M315 418H321M318 415V421M211 418H217M214 415V421" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="0.75" class="al3d-late"/>
      </g></g>
    </g>

    <g id="al3d-left-leg" class="al3d-piece al3d-in al3d-in-l" style="--ix:-21.4px;--iy:11.3px">
      <g class="al3d-piece al3d-float al3d-f-l"><g transform="translate(-34 18)">
<polygon points="233,186 276,186 188,506 143,506" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.75" stroke-linejoin="round"/>
<line x1="125" y1="520" x2="143" y2="506" stroke="rgba(255,255,255,0.15)" stroke-width="0.75"/>
<line x1="215" y1="200" x2="233" y2="186" stroke="rgba(255,255,255,0.15)" stroke-width="0.75"/>
<polygon points="215,200 258,200 276,186 233,186" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.55)" stroke-width="1" stroke-linejoin="round"/>
<polygon points="258,200 170,520 188,506 276,186" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.55)" stroke-width="1" stroke-linejoin="round"/>
<polygon points="215,200 258,200 170,520 125,520" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.55)" stroke-width="1" stroke-linejoin="round"/>
<polygon points="217.27,203 254.06,203 167.71,517 128.96,517" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1" stroke-linejoin="round"/>
      </g></g>
    </g>

    <g id="al3d-right-leg" class="al3d-piece al3d-in al3d-in-r" style="--ix:0px;--iy:-24px">
      <g class="al3d-piece al3d-float al3d-f-r">
        <use href="#al3d-right-art"/>
        <g clip-path="url(#al3d-clip-front)"><polygon class="al3d-sheen" points="300,520 340,520 400,120 360,120" fill="url(#al3d-sheen-grad)"/></g>
      </g>
    </g>
  </g>

  <g id="al3d-callouts" class="al3d-fade" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.75">
    <polyline points="221.9,416.44 221.9,548 112,548"/>
    <polyline points="195.86,347.56 124,347.56"/>
    <polyline points="303.28,130.26 392,130.26"/>
    <g fill="#fff" stroke="none"><circle cx="221.9" cy="416.44" r="2"/><circle cx="195.86" cy="347.56" r="2"/></g>
  </g>
  <g id="al3d-labels" class="al3d-fade">
    <text class="al3d-num" x="40" y="535">01</text><text class="al3d-name" x="40" y="552">Idea</text><text class="al3d-sub" x="40" y="566">Wireframe</text>
    <text class="al3d-num" x="40" y="337.56">02</text><text class="al3d-name" x="40" y="351.56">Prototype</text><text class="al3d-sub" x="40" y="365.56">Glass</text>
    <text class="al3d-num" x="400" y="120.26">03</text><text class="al3d-name" x="400" y="134.26">Launch</text><text class="al3d-sub" x="400" y="148.26">Chrome</text>
    <circle class="al3d-pulse" cx="303.28" cy="130.26" r="5" fill="#fff" filter="url(#al3d-glow)"/>
    <circle cx="303.28" cy="130.26" r="2.5" fill="#fff"/>
  </g>
</svg>
